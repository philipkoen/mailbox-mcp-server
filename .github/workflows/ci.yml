name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This fork uses npm (package-lock.json), not bun.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on any known high or critical advisory in runtime dependencies.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint & format check
        run: npm run check

      - name: Type check
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check coverage
        run: npm run test:coverage
